[project]
name = "perceive-decide-act"
version = "0.1.0"
description = "Four-role cognitive agent loop: Memory → Perception → Decision → Action"
requires-python = ">=3.11,<3.14"  # 3.14 lacks lxml wheels on Windows
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "anyio>=4.0",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",
    "tavily-python>=0.3",
    "crawl4ai>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
